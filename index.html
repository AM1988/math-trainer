<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Математичний тренажер</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app">
    <!-- ЕКРАН НАЛАШТУВАНЬ -->
    <section id="setup" class="screen">
      <h1 class="title">🧮 Математичний тренажер</h1>
      <p class="subtitle">Обери, що хочеш тренувати</p>

      <div class="block">
        <h2>Тип вправ</h2>
        <div class="chips" id="modeChips">
          <button class="chip active" data-mode="add">➕ Додавання</button>
          <button class="chip" data-mode="sub">➖ Віднімання</button>
          <button class="chip" data-mode="mul">✖️ Множення</button>
          <button class="chip" data-mode="div">➗ Ділення</button>
          <button class="chip" data-mode="table">🔢 Таблиця множення</button>
          <button class="chip" data-mode="expr">🧠 Приклади (a:b + a×c)</button>
          <button class="chip chip-advanced" data-mode="advanced">🚀 Просунутий (все разом)</button>
        </div>
        <p class="hint">Можна обрати кілька типів одразу. «Просунутий» вмикає все й додає складні приклади.</p>
      </div>

      <div class="block">
        <h2>Діапазон чисел</h2>
        <div class="chips" id="rangeChips">
          <button class="chip" data-range="20">до 20</button>
          <button class="chip" data-range="100">до 100</button>
          <button class="chip active" data-range="1000">до 1000</button>
        </div>
      </div>

      <div class="block">
        <h2>Таймер на приклад</h2>
        <div class="chips" id="timerChips">
          <button class="chip active" data-timer="0">Вимкнено</button>
          <button class="chip" data-timer="10">10 с</button>
          <button class="chip" data-timer="20">20 с</button>
          <button class="chip" data-timer="30">30 с</button>
        </div>
      </div>

      <div class="block">
        <h2>Звук</h2>
        <div class="chips" id="soundChips">
          <button class="chip active" id="soundToggle" data-sound="on">🔊 Звук</button>
          <button class="chip active" id="voiceToggle" data-voice="on">🗣️ Голос заохочення</button>
        </div>
      </div>

      <div class="block">
        <h2>Як відповідати</h2>
        <div class="chips" id="answerChips">
          <button class="chip active" data-answer="input">⌨️ Вводити з клавіатури</button>
          <button class="chip" data-answer="choice">🔢 Обирати з варіантів</button>
          <button class="chip" data-answer="random">🎲 Випадково</button>
        </div>
      </div>

      <div class="block">
        <h2>Кількість прикладів</h2>
        <div class="chips" id="countChips">
          <button class="chip" data-count="5">5</button>
          <button class="chip active" data-count="10">10</button>
          <button class="chip" data-count="20">20</button>
          <button class="chip" data-count="0">∞ Без ліміту</button>
          <input id="customCount" class="mini-input" type="number" min="1" max="500"
                 inputmode="numeric" placeholder="своя ✏️" />
        </div>
      </div>

      <button id="startBtn" class="btn-primary btn-big">Почати ▶</button>
    </section>

    <!-- ЕКРАН ГРИ -->
    <section id="game" class="screen hidden">
      <div class="topbar">
        <button id="backBtn" class="btn-ghost">← Назад</button>
        <div class="stats">
          <span class="stat stat-score">⭐ <b id="score">0</b></span>
          <span class="stat stat-streak">🔥 <b id="streak">0</b></span>
          <span class="stat stat-progress" id="progress">1 / 10</span>
        </div>
      </div>

      <div class="progressbar"><div id="progressFill" class="progressbar-fill"></div></div>

      <div id="timerWrap" class="timer-wrap hidden">
        <div class="timer-bar"><div id="timerFill" class="timer-fill"></div></div>
        <div id="timerText" class="timer-text">⏱ 0</div>
      </div>

      <div class="question-card">
        <div id="question" class="question">2 + 2 = ?</div>

        <div id="inputArea" class="answer-area">
          <input id="answerInput" class="answer-input" type="number" inputmode="numeric"
                 placeholder="?" autocomplete="off" />
          <button id="checkBtn" class="btn-primary">Перевірити</button>
        </div>

        <div id="choiceArea" class="answer-area choices hidden"></div>

        <div id="feedback" class="feedback"></div>
      </div>
    </section>

    <!-- ЕКРАН РЕЗУЛЬТАТІВ -->
    <section id="result" class="screen hidden">
      <h1 class="title" id="resultEmoji">🎉</h1>
      <h2 id="resultText">Молодець!</h2>
      <div class="result-stats">
        <div class="result-stat"><span id="finalCorrect">0</span><small>правильно</small></div>
        <div class="result-stat"><span id="finalTotal">0</span><small>всього</small></div>
        <div class="result-stat"><span id="finalPercent">0%</span><small>точність</small></div>
      </div>
      <div class="result-buttons">
        <button id="againBtn" class="btn-primary">Ще раз 🔁</button>
        <button id="menuBtn" class="btn-ghost">У меню 🏠</button>
      </div>
    </section>
  </div>

  <script src="app.js"></script>
</body>
</html>
